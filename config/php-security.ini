; Limites communes : la validation applicative reste indispensable.
upload_max_filesize = 5M
post_max_size = 6M
max_file_uploads = 1
max_execution_time = 30
max_input_time = 30
memory_limit = 256M
upload_tmp_dir = /tmp
max_input_vars = 100

; High/Secure restent sûrs sans dépendre de cette configuration.
; Low/Medium sont des modules volontairement vulnérables de laboratoire.
allow_url_fopen = On
; allow_url_include est déprécié depuis PHP 7.4 et supprimé des versions récentes :
; on le laisse désactivé pour éviter l'avertissement de dépréciation.
; La démonstration RFI n'en dépend pas (l'atelier porte sur l'inclusion locale).
allow_url_include = Off
display_errors = Off
log_errors = On
expose_php = Off

session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Strict
session.use_trans_sid = 0
