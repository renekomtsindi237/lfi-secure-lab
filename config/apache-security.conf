ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Vhost principal : la racine web est public/ (le reste du projet est hors racine web)
<VirtualHost *:80>
    ServerName lab-security
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes -ExecCGI -Includes
        AllowOverride None
        Require all granted
        LimitRequestBody 6291456
    </Directory>

    # Dossier des téléversements publics (Low/Medium/High) : listage interdit.
    # Les .php y sont volontairement exécutables (démonstration de la faille).
    <Directory /var/www/html/public/uploads>
        Options -Indexes
    </Directory>
</VirtualHost>

# Défense en profondeur : dossiers sensibles hors racine web (lib, storage, includes, source)
<Directory /var/www/html/lib>
    Require all denied
</Directory>
<Directory /var/www/html/storage>
    Require all denied
</Directory>
<Directory /var/www/html/includes>
    Require all denied
</Directory>
<Directory /var/www/html/source>
    Require all denied
</Directory>
